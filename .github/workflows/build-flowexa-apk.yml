name: Build and Release Flowexa Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'android/**'
      - '.github/workflows/build-flowexa-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flowexa APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build Android Release APK
        id: build_apk
        shell: bash
        env:
          KEYSTORE_PASSWORD: "flowexa123"
          KEY_ALIAS: "flowexa"
          KEY_PASSWORD: "flowexa123"
        run: |
          set -e

          # Detect target android directory
          if [ -d "android-app" ]; then
            TARGET="android-app"
          else
            TARGET="android"
          fi
          echo "Selected project directory: $TARGET"

          # Ensure gradlew is executable
          chmod +x "$TARGET/gradlew"

          # Ensure keystore exists for signing
          mkdir -p "$TARGET/app"
          KEYSTORE_PATH="$TARGET/app/flowexa-release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating release keystore at $KEYSTORE_PATH..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias flowexa \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass flowexa123 \
              -keypass flowexa123 \
              -dname "CN=Flowexa, OU=Mobile, O=Flowexa, L=City, S=State, C=US"
          fi

          # Accept SDK licenses if sdkmanager exists
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

          # Run Gradle build
          cd "$TARGET"
          echo "Starting Gradle build..."
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

          # Locate and copy generated APK
          mkdir -p build-output
          APK_FILE=$(find "$TARGET/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file generated!"
            exit 1
          fi

          echo "Found generated APK: $APK_FILE"
          cp "$APK_FILE" build-output/Flowexa.apk
          ls -lh build-output/Flowexa.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowexa-Android-APK
          path: build-output/Flowexa.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.0
          name: Flowexa Android v2.0.0
          body: |
            تطبيق Flowexa Native للأندرويد (Flowexa Native Android v2.0.0).
            
            - تطبيق ناتيف 100% بنظام Kotlin + Jetpack Compose + Material 3.
            - قاعدة بيانات محلية Room Database كاملة لدعم العمل دون اتصال بالإنترنت (Offline-First).
            - محرك مزامنة Outbox وسيط (SyncEngine) متوافق مع Firebase Firestore.
            - دعم إنشاء الطلبات وحساب البونص وتعدد العملات أوفلاين.
            - واجهة كاملة باللغة العربية مع دعم RTL وشعار Flowexa الرسمي.
          files: build-output/Flowexa.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
