name: Build and Release Flowexa Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-flowexa-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flowexa Native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWEXA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLOWEXA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWEXA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWEXA_KEY_PASSWORD }}
          FIREBASE_CONFIG_BASE64: ${{ secrets.FLOWEXA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(FLOWEXA_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(FLOWEXA_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(FLOWEXA_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(FLOWEXA_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          KEYSTORE_PATH=android-app/app/flowexa-release.keystore
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          if [[ -n "$FIREBASE_CONFIG_BASE64" ]]; then
            printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > android-app/app/google-services.json
            chmod 600 android-app/app/google-services.json
          else
            echo "::warning::FLOWEXA_GOOGLE_SERVICES_JSON_BASE64 is not set; Firebase runtime setup is incomplete."
          fi

      - name: Ensure Gradle wrapper is executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Build Android Release APK
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FLOWEXA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWEXA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWEXA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE=$(find android-app/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [[ -z "$APK_FILE" || ! -f "$APK_FILE" ]]; then
            echo "::error::Release APK file was not produced!"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android build-tools apksigner was not found!"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_FILE"
          mkdir -p build-output
          cp "$APK_FILE" build-output/Flowexa.apk
          ls -lh build-output/Flowexa.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowexa-Android-APK
          path: build-output/Flowexa.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.0
          name: Flowexa Android v2.0.0
          body: |
            تطبيق Flowexa Native للأندرويد (Flowexa Native Android v2.0.0).
            - تطبيق Kotlin + Jetpack Compose + Material 3.
            - قاعدة بيانات Room ومحرك مزامنة Outbox للعمل دون اتصال.
            - الإصدار مبني من android-app وموقع بالمفتاح الدائم المحفوظ في GitHub Secrets.
          files: build-output/Flowexa.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
