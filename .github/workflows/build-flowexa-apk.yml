name: Build and Release Flowexa Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android-app/**'
      - 'scripts/ci/**'
      - 'public/.well-known/assetlinks.json'
      - '.github/workflows/build-flowexa-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flowexa-android-release
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build and Validate Flowexa Native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_sha256: ${{ steps.validate.outputs.apk_sha256 }}
      signer_sha256: ${{ steps.validate.outputs.signer_sha256 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Trusted Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Version code is monotonic: the GitHub run number always increases.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${RAW_TAG#v}"
          elif [[ -n "$(git tag --points-at HEAD -l 'v*' | head -n1)" ]]; then
            RAW_TAG="$(git tag --points-at HEAD -l 'v*' | head -n1)"
            VERSION_NAME="${RAW_TAG#v}"
          else
            VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}"
          fi

          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          if ! [[ "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Computed versionName '${VERSION_NAME}' is not a valid semver."
            exit 1
          fi

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Restore and Validate Keystore & Firebase Config
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWEXA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLOWEXA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWEXA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWEXA_KEY_PASSWORD }}
          FIREBASE_CONFIG_BASE64: ${{ secrets.FLOWEXA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          missing=()

          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(FLOWEXA_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(FLOWEXA_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(FLOWEXA_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(FLOWEXA_KEY_PASSWORD)
          [[ -n "$FIREBASE_CONFIG_BASE64" ]] || missing+=(FLOWEXA_GOOGLE_SERVICES_JSON_BASE64)

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "::error::Configure all signing secrets and FLOWEXA_GOOGLE_SERVICES_JSON_BASE64 before releasing."
            exit 1
          fi

          KEYSTORE_PATH=android-app/app/flowexa-release.keystore
          mkdir -p "$(dirname "$KEYSTORE_PATH")"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          # Public value (certificate fingerprint). Printed early so a mismatch is easy to fix.
          echo "Release keystore certificate (public):"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>/dev/null | grep -m1 "SHA256:" | sed 's/^ *//'

          SERVICES_JSON_PATH=android-app/app/google-services.json
          printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > "$SERVICES_JSON_PATH"
          chmod 600 "$SERVICES_JSON_PATH"

          # Strict validation of google-services.json
          python3 -c "
          import json
          import sys

          with open('$SERVICES_JSON_PATH') as f:
              data = json.load(f)

          project_id = data.get('project_info', {}).get('project_id')

          if not project_id:
              sys.exit('Missing project_id in google-services.json')

          client_packages = [
              c.get('client_info', {})
               .get('android_client_info', {})
               .get('package_name')
              for c in data.get('client', [])
          ]

          if 'com.flowexa.app' not in client_packages:
              sys.exit(
                  f'Package com.flowexa.app not found in google-services.json clients: {client_packages}'
              )

          print(
              f'Firebase config validated successfully for project: {project_id}'
          )
          "

      - name: Ensure Gradle wrapper is executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FLOWEXA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWEXA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWEXA_KEY_PASSWORD }}
          FLOWEXA_VERSION_NAME: ${{ env.VERSION_NAME }}
          FLOWEXA_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Build Android Release APK
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FLOWEXA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWEXA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWEXA_KEY_PASSWORD }}
          FLOWEXA_VERSION_NAME: ${{ env.VERSION_NAME }}
          FLOWEXA_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Release Validation Pipeline (ZIP, zipalign, aapt2, apksigner, expected signer, assetlinks)
        id: validate
        shell: bash
        env:
          EXPECTED_VERSION_NAME: ${{ env.VERSION_NAME }}
          EXPECTED_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: bash scripts/ci/validate-release-apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowexa-Android-APK
          path: build-output/Flowexa.apk
          if-no-files-found: error
          retention-days: 30

  runtime-smoke:
    name: Runtime Smoke Test (Android 35 emulator)
    needs: build-and-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download the exact APK built by the previous job
        uses: actions/download-artifact@v4
        with:
          name: Flowexa-Android-APK
          path: build-output

      - name: Verify downloaded APK is byte-identical to the validated one
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build-and-validate.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum build-output/Flowexa.apk | awk '{print $1}')
          if [[ "$ACTUAL" != "$EXPECTED_SHA256" ]]; then
            echo "::error::APK changed between jobs (expected $EXPECTED_SHA256, got $ACTUAL)"
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and smoke-test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/emulator-smoke.sh

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore
          retention-days: 14

  instrumented-migration-test:
    # Runs the real Room MIGRATION_1_2 on an emulator. NOT yet a gate for publish-release:
    # it is a new test that has never run in CI. After it passes once, add it to
    # publish-release.needs so a broken migration blocks releases.
    name: Instrumented Room migration test
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Ensure Gradle wrapper is executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android-app
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: android-app/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    # The release is published ONLY after build, validation AND runtime smoke test passed.
    needs: [build-and-validate, runtime-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: Flowexa-Android-APK
          path: build-output

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-validate.outputs.version_name }}
          name: Flowexa Android v${{ needs.build-and-validate.outputs.version_name }}
          body: |
            تطبيق Flowexa Native للأندرويد (Flowexa Native Android v${{ needs.build-and-validate.outputs.version_name }}).
            - Version code: `${{ needs.build-and-validate.outputs.version_code }}`
            - تطبيق Kotlin + Jetpack Compose + Material 3.
            - قاعدة بيانات Room ومحرك مزامنة Outbox للعمل دون اتصال.
            - اجتاز: الاختبارات، التحقق من التوقيع (apksigner)، المحاذاة (zipalign)، تطابق بصمة المُوقِّع المتوقعة، وتثبيت وتشغيل على محاكي Android 35.
            - SHA-256 (APK): `${{ needs.build-and-validate.outputs.apk_sha256 }}`
            - Signer certificate SHA-256: `${{ needs.build-and-validate.outputs.signer_sha256 }}`
          files: build-output/Flowexa.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
