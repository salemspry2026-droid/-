name: Build and Release Flowexa Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-flowexa-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flowexa Native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build Android Release APK
        id: build_apk
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWEXA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLOWEXA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWEXA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWEXA_KEY_PASSWORD }}
        run: |
          set -e

          TARGET="android-app"
          echo "Targeting Native Android project in: $TARGET"
          
          if [ ! -d "$TARGET" ]; then
            echo "::error::Target directory $TARGET does not exist!"
            exit 1
          fi

          # Ensure gradlew has executable permission
          chmod +x "$TARGET/gradlew"

          # Restore Keystore from Secret if available, or generate persistent keystore
          KEYSTORE_PATH="$TARGET/app/flowexa-release.keystore"
          mkdir -p "$TARGET/app"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          elif [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating fallback release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "${KEY_ALIAS:-flowexa}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-flowexa123}" \
              -keypass "${KEY_PASSWORD:-flowexa123}" \
              -dname "CN=Flowexa, OU=Mobile, O=Flowexa, L=City, S=State, C=US"
          fi

          # Accept SDK licenses
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

          # Build strict Release APK
          cd "$TARGET"
          echo "Running assembleRelease..."
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

          # Verify generated APK
          mkdir -p build-output
          APK_FILE=$(find "$TARGET/app/build/outputs/apk/release" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK file was not produced!"
            exit 1
          fi

          echo "Found generated Release APK: $APK_FILE"
          cp "$APK_FILE" build-output/Flowexa.apk
          ls -lh build-output/Flowexa.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flowexa-Android-APK
          path: build-output/Flowexa.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.0
          name: Flowexa Android v2.0.0
          body: |
            تطبيق Flowexa Native للأندرويد (Flowexa Native Android v2.0.0).
            
            - تطبيق ناتيف 100% بنظام Kotlin + Jetpack Compose + Material 3.
            - قاعدة بيانات محلية Room Database كاملة لدعم العمل دون اتصال بالإنترنت (Offline-First).
            - محرك مزامنة Outbox وسيط (SyncEngine) متوافق مع Firebase Firestore.
            - دعم إنشاء وإدارة الطلبات والعملاء والأصناف وحساب البونص والعملات المتعددة.
            - واجهة كاملة باللغة العربية مع دعم RTL وشعار Flowexa الرسمي.
          files: build-output/Flowexa.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
